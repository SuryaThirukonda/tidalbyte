<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WishWorld</title>
<meta name="description" content="WishWorld headset view: a snowy world of wishes, in your room or in VR.">
<meta name="theme-color" content="#80a1c9">
<link rel="icon" href="data:,">
<script type="importmap">{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<style>
  /* The Unity game's palette (Assets/WishWorld/Resources/WWTheme.asset). */
  :root {
    --snow: #f2f7fc; --slate: #334052; --peach: #ffb88c; --panel: #edf2f7; --button: #d1e0f0;
    --ice: #8fb0d4; --ribbon: #45618c; --shade: #788ca8; --snow-white: #fbfcff; --snow-under: #c2d6ed;
    --title: "WW Title", Georgia, "Times New Roman", serif;
    --heading: "WW Heading", Georgia, "Times New Roman", serif;
    --body: "WW Body", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dbe5f2; color: var(--slate); font-family: var(--body); }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; visibility: hidden; }
  body.running canvas#view { visibility: visible; cursor: crosshair; }
  body.running.arpreview { background: #6b6e73; }   /* Unity's stand-in for the real room when there is no headset */

  /* ---- start page: the hub's sky, a ribbon and one snowy card ---- */
  #start {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 24px 16px; overflow: auto;
    background: linear-gradient(#80a1c9 0%, #b9cde3 46%, #dbe5f2 70%, #f2f7fc 100%);
  }
  #start[hidden] { display: none; }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none; overflow: hidden; }
  .hills i { position: absolute; bottom: -18vh; border-radius: 50%; background: #f2f7fc; }
  .hills i:nth-child(1) { left: -12%; width: 62%; height: 40vh; background: #d6e3f2; }
  .hills i:nth-child(2) { right: -16%; width: 70%; height: 44vh; background: #e3ecf6; }
  .hills i:nth-child(3) { left: 18%; width: 74%; height: 34vh; }
  .flakes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .flakes i { position: absolute; top: -4vh; width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .9; animation: fall linear infinite; }
  @keyframes fall { to { transform: translate3d(3vw, 110vh, 0); } }
  @media (prefers-reduced-motion: reduce) { .flakes i { animation: none; top: 30vh; } }

  .stack { position: relative; width: min(560px, 100%); display: grid; justify-items: center; }
  .ribbon {
    position: relative; z-index: 2; margin-bottom: -22px; padding: 6px 54px 10px;
    background: linear-gradient(#6f86a8, var(--ribbon)); color: var(--snow);
    border: 4px solid var(--slate); border-radius: 6px;
    font: 700 clamp(40px, 9vw, 64px)/1.1 var(--title); letter-spacing: .01em;
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .0);
  }
  .ribbon::before, .ribbon::after {
    content: ""; position: absolute; top: 18%; width: 46px; height: 100%; background: #364c6e; z-index: -1;
    border: 4px solid var(--slate);
  }
  .ribbon::before { left: -34px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 38% 50%); }
  .ribbon::after { right: -34px; clip-path: polygon(0 0, 100% 0, 62% 50%, 100% 100%, 0 100%); }
  .ribbon span { display: block; border-top: 2px dashed rgba(255, 255, 255, .5); border-bottom: 2px dashed rgba(255, 255, 255, .5); padding: 0 4px; }

  .card {
    position: relative; width: 100%; padding: 54px 28px 30px; text-align: center;
    background: linear-gradient(#f7f9fc, #e4ecf5); border-radius: 30px;
    border: 5px solid var(--slate);
    box-shadow: inset 0 0 0 7px var(--snow-white), inset 0 0 0 9px var(--ice), 9px 12px 0 var(--shade);
  }
  .card::before {                      /* the snow lying along the top edge */
    content: ""; position: absolute; left: 26px; right: 26px; top: -13px; height: 24px; border-radius: 14px;
    background:
      radial-gradient(ellipse 34px 15px at 12% 60%, var(--snow-white) 98%, transparent) ,
      radial-gradient(ellipse 44px 17px at 31% 55%, var(--snow-white) 98%, transparent),
      radial-gradient(ellipse 38px 14px at 52% 62%, var(--snow-white) 98%, transparent),
      radial-gradient(ellipse 46px 18px at 72% 55%, var(--snow-white) 98%, transparent),
      radial-gradient(ellipse 34px 14px at 90% 62%, var(--snow-white) 98%, transparent),
      linear-gradient(transparent 38%, var(--snow-white) 38%, var(--snow-white) 82%, transparent 82%);
    filter: drop-shadow(0 4px 0 var(--snow-under));
  }
  .lead { margin: 0 0 22px; font: 400 clamp(19px, 3.6vw, 24px)/1.35 var(--body); }
  #enter {
    appearance: none; cursor: pointer; width: min(340px, 100%); padding: 16px 20px 20px;
    font: 400 clamp(34px, 7vw, 46px)/1 var(--heading); color: var(--slate);
    background: linear-gradient(#ffdcc6, var(--peach)); border: 5px solid var(--slate); border-radius: 30px;
    box-shadow: 0 8px 0 #a8836f, inset 0 5px 0 rgba(255, 255, 255, .55);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  #enter:hover:not(:disabled) { transform: scale(1.04); filter: brightness(1.06); box-shadow: 0 8px 0 #a8836f, inset 0 5px 0 rgba(255, 255, 255, .55), 0 0 0 9px #ffedb2; }
  #enter:active:not(:disabled) { transform: translateY(5px) scale(.98); box-shadow: 0 3px 0 #a8836f, inset 0 5px 0 rgba(255, 255, 255, .55); }
  #enter:focus-visible { outline: 4px solid #ffedb2; outline-offset: 4px; }
  #enter:disabled { cursor: progress; filter: saturate(.5) brightness(.96); }
  .modes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 26px 0 12px; }
  .modes button {
    appearance: none; cursor: pointer; padding: 8px 16px 10px; font: 400 18px/1 var(--heading); color: var(--slate);
    background: linear-gradient(#e8eff7, var(--button)); border: 3px solid var(--slate); border-radius: 16px;
    box-shadow: 0 4px 0 #7c8ea6;
  }
  .modes button.on { background: linear-gradient(#ffe6d6, #ffdcb8); }
  .modes button.off { opacity: .55; }
  .modes button:focus-visible { outline: 3px solid #ffedb2; outline-offset: 2px; }
  #status { min-height: 2.7em; margin: 0 auto; max-width: 30em; font: 400 17px/1.35 var(--body); }
  .room { margin: 14px 0 0; font: 400 17px/1.3 var(--body); }
  .room b { font: 400 20px/1 var(--heading); letter-spacing: .08em; padding: 2px 10px 4px; border-radius: 10px; background: var(--button); border: 2px solid var(--slate); }

  /* ---- desktop preview: tabs along the top, keys along the bottom ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud[hidden] { display: none; }
  #tabbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: calc(100% - 20px); pointer-events: auto; }
  #tabbar button {
    appearance: none; cursor: pointer; padding: 5px 12px 7px; font: 400 16px/1 var(--heading); color: var(--slate);
    background: linear-gradient(#e8eff7, var(--button)); border: 2.5px solid var(--slate); border-radius: 13px; box-shadow: 0 3px 0 #7c8ea6;
  }
  #tabbar button.on { background: linear-gradient(#ffe6d6, #ffdcb8); }
  #tabbar button:hover { filter: brightness(1.06); }
  #keys {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 20px);
    padding: 5px 14px 7px; font: 400 14px/1.3 var(--body); color: var(--slate); text-align: center;
    background: rgba(237, 242, 247, .9); border: 2px solid var(--slate); border-radius: 12px;
    /* The hint sits where the guide's speech bubble appears, so it steps aside after a while. Press H to see it again. */
    animation: keys-away .8s ease 14s forwards; pointer-events: none;
  }
  #keys.show { animation: none; opacity: 1; }
  @keyframes keys-away { to { opacity: 0; } }
  #stats { position: absolute; top: 52px; right: 10px; padding: 3px 8px; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; background: rgba(51, 64, 82, .82); color: #fff; border-radius: 6px; }
  #stats[hidden] { display: none; }

  /* ---- play in browser: a crosshair while the mouse is captured, a pause card, touch controls ---- */
  #crosshair, #touchpad, #joy { display: none; }
  body.play.locked #crosshair, body.play.touch #crosshair {
    display: block; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border: 3px solid var(--snow-white); border-radius: 50%; box-shadow: 0 0 0 2px var(--slate), inset 0 0 0 2px var(--slate);
  }
  body.play.touch #crosshair { opacity: .55; }
  body.play.locked #tabbar, body.play.touch #tabbar { display: none; }
  .pause { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(51, 64, 82, .45); z-index: 5; }
  .pause[hidden] { display: none; }
  .pause .card { max-width: 420px; padding: 40px 24px 26px; }
  .pause .lead { font: 400 34px/1 var(--heading); margin-bottom: 18px; }
  .pause .big {
    appearance: none; cursor: pointer; width: 100%; padding: 12px 16px 15px; font: 400 30px/1 var(--heading); color: var(--slate);
    background: linear-gradient(#ffdcc6, var(--peach)); border: 4px solid var(--slate); border-radius: 24px; box-shadow: 0 6px 0 #a8836f;
  }
  .pause .modes { margin-top: 18px; }
  body.play.touch #touchpad {
    display: flex; flex-direction: column; gap: 12px; position: absolute; right: 16px; bottom: 22px; pointer-events: auto;
  }
  body.play.touch #touchpad button {
    appearance: none; width: 84px; height: 84px; border-radius: 50%; font: 400 20px/1 var(--heading); color: var(--slate);
    background: rgba(237, 242, 247, .82); border: 3px solid var(--slate); box-shadow: 0 4px 0 #7c8ea6; touch-action: none; user-select: none;
  }
  body.play.touch #touchpad button[data-press="a"] { background: rgba(255, 210, 180, .9); }
  body.play.touch #touchpad button.down { transform: translateY(3px); box-shadow: 0 1px 0 #7c8ea6; }
  body.play.touch #joy:not([hidden]) {
    display: block; position: absolute; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%;
    border: 3px solid rgba(237, 242, 247, .9); background: rgba(51, 64, 82, .25);
  }
  #joyknob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(237, 242, 247, .9); border: 3px solid var(--slate); }
  body.play.touch #view { touch-action: none; }

  /* ---- the room chip: switch room from inside the game ---- */
  #roombox { position: absolute; top: 10px; left: 10px; pointer-events: auto; max-width: calc(100% - 20px); }
  body.play.locked #roombox { display: none; }
  #roomchip {
    appearance: none; cursor: pointer; padding: 5px 12px 7px; font: 400 16px/1 var(--heading); color: var(--slate);
    background: linear-gradient(#e8eff7, var(--button)); border: 2.5px solid var(--slate); border-radius: 13px; box-shadow: 0 3px 0 #7c8ea6;
  }
  #roomchip b { letter-spacing: .06em; }
  #roomform {
    margin-top: 8px; width: 250px; max-width: 100%; padding: 12px; background: rgba(237, 242, 247, .97);
    border: 2.5px solid var(--slate); border-radius: 14px; box-shadow: 0 4px 0 #7c8ea6; font: 400 15px/1.3 var(--body); color: var(--slate);
  }
  #roomform[hidden] { display: none; }
  #roomform label { display: block; font: 400 17px/1.2 var(--heading); margin-bottom: 6px; }
  .roomrow { display: flex; gap: 6px; }
  #roominput { flex: 1; min-width: 0; padding: 6px 8px; font: 400 18px/1 var(--heading); letter-spacing: .08em; text-transform: uppercase;
    border: 2px solid var(--slate); border-radius: 10px; background: #fff; color: var(--slate); }
  #roomform button { appearance: none; cursor: pointer; padding: 6px 10px 8px; font: 400 15px/1 var(--heading); color: var(--slate);
    background: linear-gradient(#ffe6d6, #ffdcb8); border: 2px solid var(--slate); border-radius: 10px; }
  #recentrooms { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  #recentrooms:empty { display: none; }
  #recentrooms button { background: linear-gradient(#e8eff7, var(--button)); letter-spacing: .06em; }
  #roomform .roomnew { margin-top: 8px; width: 100%; background: linear-gradient(#e8eff7, var(--button)); }
  #roomerr { margin: 6px 0 0; min-height: 0; color: #9b3b2f; }
  #roomerr:empty { display: none; }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="WishWorld"></canvas>

<main id="start">
  <div class="flakes" aria-hidden="true">
    <i style="left:6%;animation-duration:11s;animation-delay:-2s"></i><i style="left:17%;animation-duration:14s;animation-delay:-9s;width:5px;height:5px"></i>
    <i style="left:29%;animation-duration:12s;animation-delay:-5s"></i><i style="left:41%;animation-duration:16s;animation-delay:-12s;width:9px;height:9px"></i>
    <i style="left:53%;animation-duration:13s;animation-delay:-1s;width:5px;height:5px"></i><i style="left:64%;animation-duration:15s;animation-delay:-7s"></i>
    <i style="left:76%;animation-duration:11s;animation-delay:-10s;width:9px;height:9px"></i><i style="left:87%;animation-duration:17s;animation-delay:-4s"></i>
    <i style="left:95%;animation-duration:13s;animation-delay:-8s;width:5px;height:5px"></i>
  </div>
  <div class="hills" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="stack">
    <h1 class="ribbon"><span>WishWorld</span></h1>
    <section class="card">
      <p class="lead">Put on the headset, then press Enter. No headset? Play in the browser.</p>
      <button id="enter" type="button" disabled>Loading</button>
      <div class="modes" role="group" aria-label="How to enter">
        <button type="button" data-mode="ar">In my room</button>
        <button type="button" data-mode="vr">VR</button>
        <button type="button" data-mode="play">Play in browser</button>
        <button type="button" data-mode="desktop">Preview</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="room">Room <b id="room">WISH</b></p>
    </section>
  </div>
</main>

<div id="hud" hidden>
  <nav id="tabbar" aria-label="Tabs"></nav>
  <div id="roombox">
    <button id="roomchip" type="button" title="Switch room">Room <b id="hudroom">WISH</b></button>
    <form id="roomform" hidden>
      <label for="roominput">Join a room</label>
      <div class="roomrow">
        <input id="roominput" maxlength="8" placeholder="Room code" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="submit">Join</button>
      </div>
      <div id="recentrooms" aria-label="Rooms used on this device"></div>
      <button id="roomnew" type="button" class="roomnew">New room</button>
      <p id="roomerr" role="alert"></p>
    </form>
  </div>
  <div id="stats" hidden></div>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="joy" hidden aria-hidden="true"><i id="joyknob"></i></div>
  <div id="touchpad" aria-label="Controls">
    <button type="button" data-press="a">Talk</button>
    <button type="button" data-press="grip">Grab</button>
    <button type="button" data-press="menu">Menu</button>
  </div>
  <div id="keys">Drag to look · W A S D to move · Click = trigger · G or right click = grip · hold V = make a wish · M = menu · R = recentre · 1 to 9 = tabs · H = show this</div>
</div>

<div id="pause" class="pause" hidden>
  <section class="card">
    <p class="lead">Paused</p>
    <button id="resume" type="button" class="big">Keep playing</button>
    <div class="modes"><button id="pause-menu" type="button">Menu</button><button id="pause-room" type="button">Room</button><button id="pause-leave" type="button">Leave</button></div>
  </section>
</div>

<script type="module" src="/vr/main.js"></script>
<script>addEventListener('keydown', (e) => { if (e.key === 'h' || e.key === 'H') { const k = document.getElementById('keys'); if (k) k.classList.toggle('show'); } });</script>
</body>
</html>
