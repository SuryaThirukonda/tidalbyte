<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fa1c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>WishWorld: send a wish</title>
<meta name="description" content="Send a wish, a scanned toy or a letter into a child's WishWorld room.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%237fa1c9'/%3E%3Cpath d='M16 6l2.7 6.5 7 .800-5.3 4.6 1.7 6.9L16 21.1l-6.1 3.7 1.7-6.9-5.3-4.6 7-.800z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/phone/theme.css">
<link rel="stylesheet" href="/phone/phone.css">
<script type="importmap">{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/" } }</script>
<script type="module" src="/phone/app.js"></script>
</head>
<body>
<div class="ww-sky" aria-hidden="true"></div>
<div class="ww-hills" aria-hidden="true">
  <svg viewBox="0 0 400 200" preserveAspectRatio="none">
    <path d="M0 96 C60 60 110 70 160 92 C210 114 250 60 310 70 C350 76 380 92 400 84 V200 H0z" fill="#d6e3f2"/>
    <path d="M0 132 C70 100 130 128 200 120 C270 112 320 140 400 116 V200 H0z" fill="#e9f0f8"/>
    <path d="M0 164 C90 140 170 170 250 156 C310 146 360 160 400 152 V200 H0z" fill="#f5f7fa"/>
  </svg>
</div>

<div class="app" id="app">
  <header class="topbar">
    <a class="brand title" href="/" aria-label="WishWorld home">WishWorld</a>
    <button class="roomchip" id="roomChip" type="button" aria-label="Change room">
      <span class="roomchip-label">Room</span>
      <span class="roomchip-code" id="roomCode">WISH</span>
    </button>
  </header>
  <div class="forbar" id="forBar" role="radiogroup" aria-label="Who is it for?" hidden>
    <span class="forbar-label">For</span>
    <div class="forbar-list" id="forList"></div>
  </div>

  <main id="view">
    <section class="panel" id="tab-send" data-tab="send" aria-labelledby="tabbtn-send" hidden></section>
    <section class="panel" id="tab-scan" data-tab="scan" aria-labelledby="tabbtn-scan" hidden></section>
    <section class="panel" id="tab-letter" data-tab="letter" aria-labelledby="tabbtn-letter" hidden></section>
    <section class="panel" id="tab-inbox" data-tab="inbox" aria-labelledby="tabbtn-inbox" hidden></section>
    <section class="panel" id="tab-ar" data-tab="ar" aria-labelledby="tabbtn-ar" hidden></section>
  </main>
  <noscript><div class="card"><p>WishWorld needs JavaScript turned on.</p></div></noscript>
</div>

<nav class="tabbar" id="tabbar" aria-label="WishWorld sections"></nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="sheet" id="roomDialog" aria-labelledby="roomDialogTitle">
  <form method="dialog" class="sheet-body" id="roomForm">
    <h2 class="heading" id="roomDialogTitle">Which room?</h2>
    <p class="muted small">The room code is on the WishWorld start page, next to the QR code.</p>
    <label class="label" for="roomInput">Room code</label>
    <input class="field code-input" id="roomInput" name="room" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8">
    <div class="sheet-actions">
      <button class="btn" type="button" id="roomCancel">Cancel</button>
      <button class="btn primary" type="submit" id="roomSave">Use this room</button>
    </div>
  </form>
</dialog>
</body>
</html>
